name: Extract Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: Unpack Diagnostic Controller
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Extract repository without committing
        run: |
          python bootstrap.py --target . --force

      - name: Move restricted CI workflow out of workflows directory
        run: |
          test -f .github/workflows/ci.yml
          mv .github/workflows/ci.yml ci.workflow.yml

      - name: Commit unpacked repository
        run: |
          git add .
          git commit -m "Bootstrap diagnostic-controller v1.0"

      - name: Push unpacked repository
        run: |
          git push origin HEAD:main