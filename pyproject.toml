[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnostic-controller"
version = "1.0.0"
description = "Safety-bounded LLM Diagnostic Controller with deterministic contracts, redaction, and adversarial evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diagnostic Controller Maintainers" }]
dependencies = [
  "openai==3.10.0",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diagnostic_controller = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "model: live model evaluation requiring OPENAI_API_KEY and REDACTION_HMAC_KEY",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["diagnostic_controller"]
